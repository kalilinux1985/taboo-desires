# Supabase CLI settings (only the parts this app relies on; everything else uses CLI defaults).
project_id = "taboo-desires"

[db]
major_version = 17

[functions.api]
# Requests carry the Supabase Auth access token in x-user-token (signed-out
# visitors send none), and the function verifies it itself, so the gateway's
# JWT check is turned off.
verify_jwt = false

[functions.rapid-endpoint]
# The live function: supabase/functions/loader, which runs the latest
# backend-dist/api.cjs from GitHub. Its JWT check stays on, as in the dashboard.
verify_jwt = true

[functions.easypost-webhook]
# EasyPost tracking updates. EasyPost sends no JWT; the function only trusts
# what it reads back from EasyPost's API, so the gateway check is off.
verify_jwt = false

[functions.send-emails]
# Called by the pg_cron schedule with the project's publishable key; the JWT check stays on.
verify_jwt = true

[functions.scrub-media]
# Called by the browser after upload (with the member's token) and by a storage trigger
# (with the publishable key). Only cleans files; safe to repeat.
verify_jwt = true
