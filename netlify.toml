# Netlify build settings (Next.js is detected and served by Netlify's Next.js runtime)
[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  # --shamefully-hoist: required by Netlify for Next.js apps installed with pnpm.
  # Installs use pnpm-lock.yaml exactly; after changing package.json, run the
  # "Refresh lockfile" GitHub Action (or pnpm install) and commit the lockfile.
  PNPM_FLAGS = "--shamefully-hoist"
