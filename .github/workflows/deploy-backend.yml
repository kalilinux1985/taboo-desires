# Deploys the backend (Supabase Edge Function "rapid-endpoint") whenever the
# backend code on main changes. It bundles supabase/functions/api into one file,
# the same file that used to be pasted into the dashboard, and deploys it.
#
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Supabase dashboard -> Account -> Access Tokens -> Generate new token).
# To redeploy by hand: Actions -> Deploy backend -> Run workflow.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push waits for the current deploy
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_REF: xaczugadcbhjfnjzcdoe
  FUNCTION: rapid-endpoint

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle the backend into one file
        run: |
          mkdir -p "supabase/functions/$FUNCTION"
          npx --yes esbuild@0.28.2 supabase/functions/api/index.ts \
            --bundle --format=esm --platform=neutral --target=es2022 \
            --external:'npm:*' --outfile=bundle.js --log-level=warning
          { echo "// @ts-nocheck"; cat bundle.js; } > "supabase/functions/$FUNCTION/index.ts"
          wc -c "supabase/functions/$FUNCTION/index.ts"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" --use-api
